[project]
name = "fprior"
version = "0.0.1"
description = "Founder priors for low-label customer prediction: simulator and baselines"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fprior"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
